<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusMed - Acceso y Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
        <!-- Encabezado con Tabs -->
        <div class="bg-indigo-900 p-6 text-center text-white">
            <div class="flex items-center justify-center space-x-2 mb-2">
                <i class="fa-solid fa-heart-pulse text-3xl text-teal-400"></i>
                <span class="font-bold text-2xl tracking-wider">NexusMed</span>
            </div>
            <p class="text-xs text-indigo-200">Portal de Atención Médica Integral</p>
            
            <div class="flex mt-6 bg-indigo-950 p-1 rounded-xl">
                <button id="btn-tab-login" onclick="cambiarTab('login')" class="flex-1 py-2 text-sm font-bold rounded-lg bg-teal-500 text-slate-900 transition">Iniciar Sesión</button>
                <button id="btn-tab-registro" onclick="cambiarTab('registro')" class="flex-1 py-2 text-sm font-bold rounded-lg text-slate-300 hover:text-white transition">Registrarse (Nuevo Paciente)</button>
            </div>
        </div>

        <div class="p-6">
            <!-- Formulario Iniciar Sesión -->
            <form id="form-login" onsubmit="iniciarSesion(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Correo Electrónico</label>
                    <input type="email" id="login-correo" placeholder="ejemplo@correo.com" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Contraseña</label>
                    <input type="password" id="login-pass" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm" required>
                </div>
                <button type="submit" class="w-full bg-indigo-900 hover:bg-indigo-800 text-white font-bold py-3 rounded-lg shadow-md transition text-sm">
                    Ingresar al Sistema <i class="fa-solid fa-arrow-right-to-bracket ml-1"></i>
                </button>
            </form>

            <!-- Formulario Registro Paciente Nuevo -->
            <form id="form-registro" onsubmit="registrarPaciente(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nombre Completo</label>
                    <input type="text" id="reg-nombre" placeholder="Tu Nombre y Apellidos" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Teléfono</label>
                    <input type="tel" id="reg-telefono" placeholder="555-000-0000" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Correo Electrónico</label>
                    <input type="email" id="reg-correo" placeholder="correo@ejemplo.com" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm" required>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Crea una Contraseña</label>
                    <input type="password" id="reg-pass" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-teal-500 focus:outline-none text-sm" required>
                </div>
                <button type="submit" class="w-full bg-teal-500 hover:bg-teal-600 text-slate-900 font-bold py-3 rounded-lg shadow-md transition text-sm">
                    Crear Cuenta de Paciente <i class="fa-solid fa-user-plus ml-1"></i>
                </button>
            </form>

            <div id="msj" class="mt-4 text-center text-xs font-bold"></div>
            
            <div class="mt-6 text-center border-t border-slate-100 pt-4">
                <a href="index.html" class="text-xs text-indigo-900 hover:underline font-semibold">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Volver a la página principal
                </a>
            </div>
        </div>
    </div>

    <script>
        function cambiarTab(tab) {
            const formLogin = document.getElementById('form-login');
            const formReg = document.getElementById('form-registro');
            const btnLogin = document.getElementById('btn-tab-login');
            const btnReg = document.getElementById('btn-tab-registro');
            const msj = document.getElementById('msj');
            msj.innerText = '';

            if (tab === 'login') {
                formLogin.classList.remove('hidden');
                formReg.classList.add('hidden');
                btnLogin.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-teal-500 text-slate-900 transition";
                btnReg.className = "flex-1 py-2 text-sm font-bold rounded-lg text-slate-300 hover:text-white transition";
            } else {
                formReg.classList.remove('hidden');
                formLogin.classList.add('hidden');
                btnReg.className = "flex-1 py-2 text-sm font-bold rounded-lg bg-teal-500 text-slate-900 transition";
                btnLogin.className = "flex-1 py-2 text-sm font-bold rounded-lg text-slate-300 hover:text-white transition";
            }
        }

        function iniciarSesion(e) {
            e.preventDefault();
            const msj = document.getElementById('msj');
            const payload = {
                correo: document.getElementById('login-correo').value,
                password: document.getElementById('login-pass').value
            };

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(datos => {
                if (datos.error) {
                    msj.style.color = 'red';
                    msj.innerText = datos.error;
                } else {
                    localStorage.setItem('usuarioLogueado', JSON.stringify(datos.usuario));
                    if (datos.usuario.rol_id === 1) window.location.href = 'admin.html';
                    else if (datos.usuario.rol_id === 2) window.location.href = 'medico.html';
                    else window.location.href = 'paciente.html';
                }
            });
        }

        function registrarPaciente(e) {
            e.preventDefault();
            const msj = document.getElementById('msj');
            const payload = {
                nombre: document.getElementById('reg-nombre').value,
                telefono: document.getElementById('reg-telefono').value,
                correo: document.getElementById('reg-correo').value,
                password: document.getElementById('reg-pass').value,
                rol_id: 3 // Rol 3 = Paciente
            };

            fetch('/api/usuarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(datos => {
                if (datos.error) {
                    msj.style.color = 'red';
                    msj.innerText = datos.error;
                } else {
                    msj.style.color = 'green';
                    msj.innerText = '¡Cuenta creada con éxito! Iniciando sesión...';
                    
                    // Iniciar sesión automáticamente tras el registro exitoso
                    localStorage.setItem('usuarioLogueado', JSON.stringify({
                        id: datos.id,
                        correo: payload.correo,
                        nombre: payload.nombre,
                        rol_id: 3
                    }));
                    setTimeout(() => { window.location.href = 'paciente.html'; }, 1000);
                }
            });
        }
    </script>
</body>
</html>
