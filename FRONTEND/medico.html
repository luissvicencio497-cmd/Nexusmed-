<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NexusMed - Panel Médico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 p-6">
    <div class="max-w-7xl mx-auto">
        <div class="bg-indigo-900 text-white p-4 rounded-xl shadow-md flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='index.html'" class="bg-indigo-800 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-sm border border-indigo-700 transition">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Ir a Inicio
                </button>
                <h1 id="bienvenida" class="text-2xl font-bold">Panel Médico</h1>
            </div>
            <button onclick="cerrarSesion()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-lg text-sm transition">Cerrar Sesión</button>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-lg font-bold text-indigo-950 mb-4">Registrar Expediente y Receta</h3>
                <form onsubmit="guardarConsulta(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Seleccionar Paciente:</label>
                        <select id="select-paciente" class="w-full p-2.5 border rounded-lg text-sm" required>
                            <option value="">Cargando lista de pacientes...</option>
                        </select>
                    </div>
                    
                    <textarea id="sintomas" placeholder="Síntomas observados" class="w-full p-2.5 border rounded-lg text-sm" required></textarea>
                    <textarea id="diagnostico" placeholder="Diagnóstico médico" class="w-full p-2.5 border rounded-lg text-sm" required></textarea>
                    
                    <h4 class="font-bold text-sm text-slate-700 mt-2">Tratamiento Prescrito</h4>
                    <input type="text" id="medicamento" placeholder="Medicamento (ej. Paracetamol 500mg)" class="w-full p-2.5 border rounded-lg text-sm">
                    <input type="text" id="dosis" placeholder="Dosis (ej. 1 tableta)" class="w-full p-2.5 border rounded-lg text-sm">
                    <input type="text" id="frecuencia" placeholder="Frecuencia (ej. Cada 8 horas)" class="w-full p-2.5 border rounded-lg text-sm">
                    <input type="number" id="duracion" placeholder="Duración en días" class="w-full p-2.5 border rounded-lg text-sm">

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm transition">Guardar Expediente</button>
                </form>
                <div id="msj-exp" class="mt-3 text-center text-xs font-bold"></div>
            </div>

            <div class="space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold text-indigo-950 mb-4">Citas Agendadas del Día</h3>
                    <div id="tabla-citas" class="overflow-x-auto">Cargando citas...</div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold text-indigo-950 mb-4">Historial General de Expedientes del Sistema</h3>
                    <div id="tabla-expedientes-globales" class="overflow-x-auto">Cargando historial...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const usuario = JSON.parse(localStorage.getItem('usuarioLogueado'));
        if (!usuario || usuario.rol_id !== 2) window.location.href = 'login.html';

        document.getElementById('bienvenida').innerText = `Dr. ${usuario.nombre || usuario.correo}`;

        function cargarPacientes() {
            fetch('/api/pacientes')
                .then(res => res.json())
                .then(pacientes => {
                    const select = document.getElementById('select-paciente');
                    select.innerHTML = '<option value="">-- Selecciona un paciente --</option>';
                    pacientes.forEach(p => {
                        select.innerHTML += `<option value="${p.id}">${p.nombre} (ID: ${p.id})</option>`;
                    });
                });
        }

        function cargarCitas() {
            fetch(`/api/citas/${usuario.id}`)
                .then(res => res.json())
                .then(citas => {
                    const contenedor = document.getElementById('tabla-citas');
                    if (citas.length === 0) {
                        contenedor.innerHTML = '<p class="text-sm text-slate-500">Sin citas agendadas.</p>';
                        return;
                    }
                    let tabla = `<table class="w-full text-left text-xs border-collapse"><tr class="bg-slate-100"><th class="p-2 border">ID</th><th class="p-2 border">Paciente</th><th class="p-2 border">Fecha</th><th class="p-2 border">Hora</th></tr>`;
                    citas.forEach(c => {
                        const fecha = new Date(c.fecha).toLocaleDateString();
                        tabla += `<tr><td class="p-2 border">${c.id}</td><td class="p-2 border">${c.paciente}</td><td class="p-2 border">${fecha}</td><td class="p-2 border">${c.hora}</td></tr>`;
                    });
                    contenedor.innerHTML = tabla + `</table>`;
                });
        }

        function cargarExpedientesGlobales() {
            fetch('/api/admin/expedientes')
                .then(res => res.json())
                .then(expedientes => {
                    const cont = document.getElementById('tabla-expedientes-globales');
                    if (expedientes.length === 0) {
                        cont.innerHTML = '<p class="text-sm text-slate-500">No hay expedientes clínicos guardados aún.</p>';
                        return;
                    }
                    let html = `<table class="w-full text-left text-xs border-collapse">
                        <tr class="bg-slate-100">
                            <th class="p-2 border">Fecha</th>
                            <th class="p-2 border">Paciente</th>
                            <th class="p-2 border">Médico</th>
                            <th class="p-2 border">Diagnóstico</th>
                        </tr>`;
                    expedientes.forEach(e => {
                        const fecha = new Date(e.fecha_consulta).toLocaleDateString();
                        html += `<tr>
                            <td class="p-2 border">${fecha}</td>
                            <td class="p-2 border"><strong>${e.paciente}</strong></td>
                            <td class="p-2 border">${e.medico}</td>
                            <td class="p-2 border">${e.diagnostico}</td>
                        </tr>`;
                    });
                    cont.innerHTML = html + `</table>`;
                });
        }

        function guardarConsulta(e) {
            e.preventDefault();
            const payload = {
                paciente_id: document.getElementById('select-paciente').value,
                medico_id: usuario.id,
                sintomas: document.getElementById('sintomas').value,
                diagnostico: document.getElementById('diagnostico').value,
                medicamento: document.getElementById('medicamento').value,
                dosis: document.getElementById('dosis').value,
                frecuencia: document.getElementById('frecuencia').value,
                duracion_dias: document.getElementById('duracion').value
            };

            fetch('/api/expedientes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(datos => {
                const msj = document.getElementById('msj-exp');
                msj.style.color = datos.error ? 'red' : 'green';
                msj.innerText = datos.error || datos.mensaje;
                if (!datos.error) {
                    e.target.reset();
                    cargarExpedientesGlobales();
                }
            });
        }

        function cerrarSesion() {
            localStorage.removeItem('usuarioLogueado');
            window.location.href = 'login.html';
        }

        cargarPacientes();
        cargarCitas();
        cargarExpedientesGlobales();
    </script>
</body>
</html>
