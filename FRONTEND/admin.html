<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NexusMed - Panel Administrador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 p-6 relative">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="bg-indigo-900 text-white p-4 rounded-xl shadow-md flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='index.html'" class="bg-indigo-800 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-sm border border-indigo-700 transition">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Ir a Inicio
                </button>
                <h1 class="text-2xl font-bold">Panel de Administración</h1>
            </div>
            <button onclick="cerrarSesion()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded-lg text-sm transition">Cerrar Sesión</button>
        </div>

        <div class="grid md:grid-cols-3 gap-6">
            <!-- Formularios de Creación -->
            <div class="space-y-6">
                <!-- Registro de Usuario -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold text-indigo-950 mb-4"><i class="fa-solid fa-user-plus text-teal-600 mr-2"></i>Registrar Nuevo Usuario</h3>
                    <form onsubmit="registrarUsuario(event)" class="space-y-3">
                        <input type="text" id="nombre" placeholder="Nombre Completo" class="w-full p-2.5 border rounded-lg text-sm" required>
                        <input type="email" id="correo" placeholder="Correo electrónico" class="w-full p-2.5 border rounded-lg text-sm" required>
                        <input type="password" id="password" placeholder="Contraseña" class="w-full p-2.5 border rounded-lg text-sm" required>
                        <select id="rol" onchange="toggleEspecialidad()" class="w-full p-2.5 border rounded-lg text-sm" required>
                            <option value="1">Administrador</option>
                            <option value="2">Médico</option>
                            <option value="3">Paciente</option>
                        </select>
                        <div id="campo-especialidad" class="hidden">
                            <input type="text" id="especialidad" placeholder="Especialidad médica" class="w-full p-2.5 border rounded-lg text-sm">
                        </div>
                        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg text-sm transition">Guardar Usuario</button>
                    </form>
                    <div id="msj-admin" class="mt-3 text-center text-xs font-bold"></div>
                </div>

                <!-- Registro de Medicamentos -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold text-indigo-950 mb-4"><i class="fa-solid fa-pills text-teal-600 mr-2"></i>Agregar Medicamento</h3>
                    <form onsubmit="registrarMedicamento(event)" class="space-y-3">
                        <input type="text" id="med-nombre" placeholder="Nombre (ej. Ibuprofeno 600mg)" class="w-full p-2.5 border rounded-lg text-sm" required>
                        <input type="text" id="med-categoria" placeholder="Categoría (ej. Analgésico)" class="w-full p-2.5 border rounded-lg text-sm" required>
                        <textarea id="med-descripcion" placeholder="Descripción y usos terapéuticos" class="w-full p-2.5 border rounded-lg text-sm" required></textarea>
                        <input type="number" id="med-stock" placeholder="Stock disponible" class="w-full p-2.5 border rounded-lg text-sm" value="100" required>
                        <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-2.5 rounded-lg text-sm transition">Agregar al Catálogo</button>
                    </form>
                    <div id="msj-med" class="mt-3 text-center text-xs font-bold"></div>
                </div>
            </div>

            <!-- Tablas Informativas -->
            <div class="md:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-lg font-bold text-indigo-950">Lista de Usuarios Registrados</h3>
                        <span class="text-xs text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full font-semibold">* Clic en un usuario para ver su expediente</span>
                    </div>
                    <div id="tabla-usuarios" class="overflow-x-auto">Cargando usuarios...</div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-lg font-bold text-indigo-950 mb-3">Catálogo Actual de Medicamentos</h3>
                    <div id="tabla-medicamentos" class="overflow-x-auto">Cargando catálogo...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Detalles -->
    <div id="modal-detalle" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl p-6 max-w-2xl w-full shadow-2xl relative max-h-[85vh] overflow-y-auto">
            <button onclick="cerrarModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl"><i class="fa-solid fa-xmark"></i></button>
            <div class="flex items-center gap-3 mb-4">
                <div class="w-12 h-12 bg-indigo-100 text-indigo-800 rounded-full flex items-center justify-center text-xl font-bold">
                    <i class="fa-solid fa-user-doctor"></i>
                </div>
                <div>
                    <h3 id="modal-nombre" class="text-xl font-bold text-indigo-950"></h3>
                    <p id="modal-rol" class="text-xs text-teal-600 font-bold uppercase"></p>
                </div>
            </div>
            <div id="modal-contenido" class="space-y-4"></div>
            <div class="mt-6 text-right">
                <button onclick="cerrarModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold px-4 py-2 rounded-lg text-sm transition">Cerrar Ventana</button>
            </div>
        </div>
    </div>

    <script>
        const usuario = JSON.parse(localStorage.getItem('usuarioLogueado'));
        if (!usuario || usuario.rol_id !== 1) window.location.href = 'login.html';

        function toggleEspecialidad() {
            const rol = document.getElementById('rol').value;
            document.getElementById('campo-especialidad').classList.toggle('hidden', rol !== '2');
        }

        function cargarUsuarios() {
            fetch('/api/usuarios')
                .then(res => res.json())
                .then(data => {
                    let html = `<table class="w-full text-left text-xs border-collapse">
                        <tr class="bg-slate-100">
                            <th class="p-2.5 border">ID</th>
                            <th class="p-2.5 border">Nombre</th>
                            <th class="p-2.5 border">Correo</th>
                            <th class="p-2.5 border">Tipo de Usuario</th>
                            <th class="p-2.5 border">Acción</th>
                        </tr>`;
                    data.forEach(u => {
                        const esClickeable = u.rol_id !== 1;
                        const claseFila = esClickeable ? 'hover:bg-indigo-50 cursor-pointer transition' : '';
                        const funcionClic = esClickeable ? `onclick="verDetallesUsuario(${u.id}, ${u.rol_id}, '${u.nombre || u.correo}')"` : '';
                        
                        html += `<tr class="${claseFila}">
                            <td class="p-2.5 border" ${funcionClic}>${u.id}</td>
                            <td class="p-2.5 border font-semibold text-indigo-900" ${funcionClic}>${u.nombre || 'Sin nombre'}</td>
                            <td class="p-2.5 border" ${funcionClic}>${u.correo}</td>
                            <td class="p-2.5 border" ${funcionClic}><span class="px-2 py-0.5 rounded text-xs font-bold ${u.rol_id === 2 ? 'bg-blue-100 text-blue-800' : u.rol_id === 3 ? 'bg-green-100 text-green-800' : 'bg-gray-100'}">${u.rol}</span></td>
                            <td class="p-2.5 border"><button onclick="eliminarUsuario(${u.rol_id}, ${u.id})" class="bg-red-500 hover:bg-red-600 text-white px-2.5 py-1 rounded text-xs font-bold">Eliminar</button></td>
                        </tr>`;
                    });
                    document.getElementById('tabla-usuarios').innerHTML = html + `</table>`;
                });
        }

        function cargarMedicamentos() {
            fetch('/api/medicamentos')
                .then(res => res.json())
                .then(meds => {
                    const cont = document.getElementById('tabla-medicamentos');
                    if (meds.length === 0) {
                        cont.innerHTML = '<p class="text-xs text-slate-500">No hay medicamentos en el inventario.</p>';
                        return;
                    }
                    let html = `<table class="w-full text-left text-xs border-collapse">
                        <tr class="bg-slate-100">
                            <th class="p-2 border">Nombre</th>
                            <th class="p-2 border">Categoría</th>
                            <th class="p-2 border">Descripción</th>
                            <th class="p-2 border">Stock</th>
                            <th class="p-2 border">Acción</th>
                        </tr>`;
                    meds.forEach(m => {
                        html += `<tr>
                            <td class="p-2 border font-semibold text-indigo-900">${m.nombre}</td>
                            <td class="p-2 border text-teal-700">${m.categoria}</td>
                            <td class="p-2 border text-slate-600">${m.descripcion}</td>
                            <td class="p-2 border font-bold">${m.stock} uds.</td>
                            <td class="p-2 border"><button onclick="eliminarMedicamento(${m.id})" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-xs font-bold">Eliminar</button></td>
                        </tr>`;
                    });
                    cont.innerHTML = html + `</table>`;
                });
        }

        function registrarMedicamento(e) {
            e.preventDefault();
            const payload = {
                nombre: document.getElementById('med-nombre').value,
                categoria: document.getElementById('med-categoria').value,
                descripcion: document.getElementById('med-descripcion').value,
                stock: document.getElementById('med-stock').value
            };

            fetch('/api/medicamentos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(datos => {
                const msj = document.getElementById('msj-med');
                msj.style.color = datos.error ? 'red' : 'green';
                msj.innerText = datos.error || datos.mensaje;
                if (!datos.error) {
                    e.target.reset();
                    cargarMedicamentos();
                }
            });
        }

        function eliminarMedicamento(id) {
            if (confirm('¿Deseas eliminar este medicamento del catálogo?')) {
                fetch(`/api/medicamentos/${id}`, { method: 'DELETE' })
                    .then(res => res.json())
                    .then(() => cargarMedicamentos());
            }
        }

        function verDetallesUsuario(id, rol_id, nombre) {
            document.getElementById('modal-nombre').innerText = nombre;
            document.getElementById('modal-rol').innerText = rol_id === 2 ? 'Médico Especialista' : 'Paciente Registrado';
            const cont = document.getElementById('modal-contenido');
            cont.innerHTML = '<p class="text-sm text-slate-500">Cargando expediente e historial...</p>';

            const modal = document.getElementById('modal-detalle');
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            if (rol_id === 3) {
                fetch(`/api/admin/paciente-detalle/${id}`)
                    .then(res => res.json())
                    .then(data => {
                        let html = `
                            <div class="grid grid-cols-2 gap-4 text-center mb-4">
                                <div class="bg-indigo-50 p-3 rounded-lg"><span class="block text-xl font-bold text-indigo-900">${data.citas.length}</span><span class="text-xs text-slate-600">Citas Solicitadas</span></div>
                                <div class="bg-emerald-50 p-3 rounded-lg"><span class="block text-xl font-bold text-emerald-900">${data.expedientes.length}</span><span class="text-xs text-slate-600">Consultas Atendidas</span></div>
                            </div>
                            <h4 class="font-bold text-sm text-indigo-950 border-b pb-1">Historial de Citas:</h4>`;
                        
                        if (data.citas.length === 0) {
                            html += '<p class="text-xs text-slate-500">Sin citas agendadas.</p>';
                        } else {
                            html += `<ul class="space-y-1.5 text-xs text-slate-700">`;
                            data.citas.forEach(c => {
                                const fecha = new Date(c.fecha).toLocaleDateString();
                                html += `<li class="bg-slate-50 p-2 rounded border"><strong>Fecha:</strong> ${fecha} ${c.hora} hrs — <strong>Dr:</strong> ${c.medico} (${c.especialidad}) — <span class="font-semibold text-teal-700">${c.estado}</span></li>`;
                            });
                            html += `</ul>`;
                        }

                        html += `<h4 class="font-bold text-sm text-indigo-950 border-b pb-1 mt-4">Expedientes Médicos y Recetas:</h4>`;
                        if (data.expedientes.length === 0) {
                            html += '<p class="text-xs text-slate-500">Sin expedientes registrados.</p>';
                        } else {
                            data.expedientes.forEach(e => {
                                const fecha = new Date(e.fecha_consulta).toLocaleDateString();
                                html += `
                                    <div class="bg-emerald-50 border-l-4 border-emerald-500 p-3 rounded text-xs space-y-1">
                                        <div><strong>Fecha:</strong> ${fecha} | <strong>Médico:</strong> ${e.medico}</div>
                                        <div><strong>Diagnóstico:</strong> ${e.diagnostico}</div>
                                        ${e.medicamento ? `<div class="text-teal-800"><strong>Receta:</strong> ${e.medicamento} (${e.dosis} - ${e.frecuencia})</div>` : ''}
                                    </div>`;
                            });
                        }
                        cont.innerHTML = html;
                    });
            } else if (rol_id === 2) {
                fetch(`/api/admin/medico-detalle/${id}`)
                    .then(res => res.json())
                    .then(data => {
                        let html = `
                            <div class="bg-blue-50 p-3 rounded-lg text-center mb-4">
                                <span class="block text-xl font-bold text-blue-900">${data.expedientes.length}</span>
                                <span class="text-xs text-slate-600">Consultas Atendidas</span>
                            </div>
                            <h4 class="font-bold text-sm text-indigo-950 border-b pb-1">Pacientes Atendidos y Expedientes Emitidos:</h4>`;
                        
                        if (data.expedientes.length === 0) {
                            html += '<p class="text-xs text-slate-500">Sin expedientes emitidos.</p>';
                        } else {
                            data.expedientes.forEach(e => {
                                const fecha = new Date(e.fecha_consulta).toLocaleDateString();
                                html += `
                                    <div class="bg-slate-50 border p-3 rounded text-xs space-y-1">
                                        <div><strong>Fecha:</strong> ${fecha} | <strong>Paciente:</strong> ${e.paciente}</div>
                                        <div><strong>Diagnóstico:</strong> ${e.diagnostico}</div>
                                        ${e.medicamento ? `<div class="text-indigo-800"><strong>Prescripción:</strong> ${e.medicamento} (${e.dosis})</div>` : ''}
                                    </div>`;
                            });
                        }
                        cont.innerHTML = html;
                    });
            }
        }

        function cerrarModal() {
            const modal = document.getElementById('modal-detalle');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function registrarUsuario(e) {
            e.preventDefault();
            const payload = {
                nombre: document.getElementById('nombre').value,
                correo: document.getElementById('correo').value,
                password: document.getElementById('password').value,
                rol_id: document.getElementById('rol').value,
                especialidad: document.getElementById('especialidad').value
            };

            fetch('/api/usuarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(datos => {
                const msj = document.getElementById('msj-admin');
                msj.style.color = datos.error ? 'red' : 'green';
                msj.innerText = datos.error || datos.mensaje;
                if (!datos.error) {
                    e.target.reset();
                    cargarUsuarios();
                }
            });
        }

        function eliminarUsuario(rol_id, id) {
            if (confirm('¿Eliminar registro?')) {
                fetch(`/api/usuarios/${rol_id}/${id}`, { method: 'DELETE' })
                    .then(res => res.json())
                    .then(() => cargarUsuarios());
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('usuarioLogueado');
            window.location.href = 'login.html';
        }

        cargarUsuarios();
        cargarMedicamentos();
    </script>
</body>
</html>
